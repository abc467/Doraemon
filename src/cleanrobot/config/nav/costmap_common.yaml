# A26022 body: length 0.85 m, width 0.65 m. The base_link origin is at the wheel
# axle center; rear overhang is 0.2185 m and front overhang is 0.6315 m.
footprint: [[-0.2185, -0.325], [-0.2185, 0.325], [0.6315, 0.325], [0.6315, -0.325]]
footprint_padding: 0.05

transform_tolerance: 1.0

max_obstacle_height: 1.2
min_obstacle_height: 0.0

obstacle_layer:
  enabled: true
  obstacle_range: 3.5
  raytrace_range: 5.0
  track_unknown_space: true
  combination_method: 1
  observation_sources: laser_scan_sensor left_cam_source right_cam_source up_cam_source

  laser_scan_sensor:
    data_type: LaserScan
    topic: /scan
    marking: true
    clearing: true
    inf_is_valid: true

  left_cam_source:
    data_type: PointCloud2
    topic: /left/obstacle_2d
    marking: true
    # obstacle_2d is an obstacle-only synthetic cloud; keep laser as the
    # free-space clearing source so sparse projected obstacle points do not
    # accidentally raytrace away other obstacles.
    clearing: false
    min_obstacle_height: -0.5
    max_obstacle_height: 2.0
    obstacle_range: 2.5
    raytrace_range: 3.0

  right_cam_source:
    data_type: PointCloud2
    topic: /right/obstacle_2d
    marking: true
    clearing: false
    min_obstacle_height: -0.5
    max_obstacle_height: 2.0
    obstacle_range: 2.5
    raytrace_range: 3.0

  up_cam_source:
    data_type: PointCloud2
    topic: /up/obstacle_2d
    marking: true
    clearing: false
    min_obstacle_height: -0.5
    max_obstacle_height: 2.0
    obstacle_range: 2.5
    raytrace_range: 3.0

inflation_layer:
  enabled: true
  # The padded front overhang is 0.6815 m from the planning origin. Keep the
  # inflation field beyond the body so MPPI starts reacting before contact.
  cost_scaling_factor: 2.5
  inflation_radius: 1.0

keepout_constraint_layer:
  enabled: true
  constraints_topic: /map_constraints/current

static_layer:
  enabled: true
  map_topic: map
