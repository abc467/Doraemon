local_costmap:
  # A rolling Costmap2D must live in an inertial frame.  Using the robot-fixed
  # base_footprint frame makes old obstacle cells rotate and translate with the
  # chassis, which creates ghost obstacles during turns and terminal alignment.
  global_frame: odom
  robot_base_frame: base_link
  # 局部代价地图与约15Hz的激光雷达/深度障碍观测对齐，
  # 避免20Hz重复处理相同观测，并保留比10Hz更低的障碍更新延迟。
  update_frequency: 15.0
  publish_frequency: 15.0
  static_map: false
  rolling_window: true
  # Keep unknown-space semantics explicit at the layered-costmap level.  The
  # static layer below turns the mapped free area into known free space; cells
  # outside the loaded map remain unknown and are rejected by the safety chain.
  track_unknown_space: true
  # 7m滚动窗口提供3.5m半窗，扩大路径重捕获和局部障碍观测范围。
  width: 7.0
  height: 7.0
  resolution: 0.05
  transform_tolerance: 1.0
  obstacle_layer:
    # 本轮U形弯A/B：暂时隔离已确认产生幽灵障碍的左右深度源；
    # 保留激光和前向深度避障，左右 obstacle_2d 仍发布但不写入代价图。
    observation_sources: laser_scan_sensor up_cam_source
    left_cam_source:
      data_type: PointCloud2
      topic: /left/obstacle_2d
      marking: true
      clearing: false
      min_obstacle_height: -0.5
      max_obstacle_height: 2.0
      obstacle_range: 2.5
    right_cam_source:
      data_type: PointCloud2
      topic: /right/obstacle_2d
      marking: true
      clearing: false
      min_obstacle_height: -0.5
      max_obstacle_height: 2.0
      obstacle_range: 2.5
    up_cam_source:
      data_type: PointCloud2
      topic: /up/obstacle_2d
      marking: true
      clearing: false
      min_obstacle_height: -0.5
      max_obstacle_height: 2.0
      obstacle_range: 2.5
  plugins:
    # Static walls must also be present in the local hard-safety map.  Relying
    # only on the instantaneous laser view leaves MPPI without a wall fallback
    # whenever a scan is occluded or momentarily delayed.
    - {name: static_layer, type: "costmap_2d::StaticLayer"}
    - {name: static_artifact_clear_layer, type: "coverage_constraints_nav/StaticArtifactClearLayer"}
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: keepout_constraint_layer, type: "coverage_constraints_nav/KeepoutConstraintLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
