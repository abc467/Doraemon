# =========================
# Move Base Flex (MBF) 插件注册
# =========================
planners:
  - name: SmacLatticePlanner
    type: "smac_lattice_planner_mbf/SmacLatticePlanner"
  # 保留旧 Theta* 插件便于回退和对照，但正式 CONNECT 不再选择它。
  - name: ThetaStarPlanner
    type: "mbf_global_planner/ThetaStarPlanner"

controllers:
  # 当前调试阶段只加载 Standard MPPI；点对点与覆盖跟踪统一使用它。
  # State 实例暂时停用。不要只删参数而保留注册，否则误调用时会加载默认值。
  # - name: MPPI_State_Lattice_Controller
  #   type: "local_planner/MPPIController"
  - name: MPPI_Standard_Controller
    type: "local_planner/MPPIController"
  - name: MyPlanner
    type: "my_planner/MyPlanner"

recovery_behaviors:
  - name: clear_costmap
    type: "clear_costmap_recovery/ClearCostmapRecovery"

# planner/controller频率与patience在mbf_timing.yaml中统一配置。
recovery_enabled: true

# 旧规划器在整个调用期持有代价地图锁；State Lattice使用不可变快照，
# 只在取得搜索快照和最终复核快照时短暂加锁。
planner_lock_costmap: true
planner_lock_costmap_overrides:
  SmacLatticePlanner: false

# 清障只作用于局部障碍层，并立即触发重建，避免重试读取刚清空的瞬态地图。
clear_costmap:
  affected_maps: local
  layer_names: [obstacle_layer]
  reset_distance: 3.0
  invert_area_to_clear: false
  force_updating: true


# =========================
# 正式全局规划器（Nav2 Smac State Lattice 的 ROS1/MBF 移植）
# =========================
SmacLatticePlanner:
  # 以 Nav2 官方差速最小控制集为基线（5 cm、32 航向、0.40 m 转弯半径），
  # 为4个轴向航向补齐8条缺失的前进左右弧。文件仍保留官方原地旋转原语，
  # 但生产的连续前进搜索会拒绝原地边，不依赖它们完成转向。
  lattice_filepath: "package://smac_lattice_planner_mbf/config/diff_5cm_0p40m_32bins_forward.json"
  # Forward-only搜索不能依赖原地旋转才能离开某些航向格。启动时强制
  # 校验32个航向都同时具备平移左弧、直线和右弧，缺一项即拒绝加载。
  require_forward_steering_primitives: true
  # The production map is complete and block endpoints are required to lie in
  # mapped free space. Keep global search, MPPI and the final filled-footprint
  # proof on the same fail-closed unknown-space policy.
  allow_unknown: false
  max_iterations: 2000000
  max_on_approach_iterations: 1000
  # Long searches must still react promptly to cancel and the wall-clock
  # deadline.  Checking every 100 expansions avoids multi-second cancel lag.
  terminal_checking_interval: 100
  # 复杂连接不再因四档后缀每20秒重启而耗尽搜索账本。
  # 总期限180秒覆盖Theta、后缀候选、FULL回退和双快照校验；
  # cancel 仍每次 expansion 检查，不会因此失去立即取消能力。
  max_planning_time: 180.0
  tolerance: 0.10
  lookup_table_size: 20.0
  goal_heading_mode: DEFAULT
  coarse_search_resolution: 1
  # 同一物理起点同时尝试最近航向格及其左右相邻格；只有从实时精确
  # 姿态原地扫掠到该格完整 footprint 安全时才加入搜索。
  start_heading_seed_span: 1

  # 复合生产模式：沿用现场已验证的 Theta* 长距离清障路径，只把
  # 最后 100 个 5 cm 参考姿态交给官方 State Lattice，生成满足终点
  # 位置与最近航向格约束的连续后缀。100 是姿态数（约 4.95 m），
  # 不是欧氏直线距离；最终小量化误差由 MPPI/MBF 分层容差共同吸收。
  theta_prefix_lattice_suffix_enabled: true
  # Nav2 Smac State Lattice 官方 smoother 的 ROS1 适配。已通过同图全连接
  # A/B并启用；只平滑State生成的后缀/FULL
  # 路径，不改Theta前缀。原始State路径始终保留，候选只有在曲率、
  # 中心软代价、Forward/Rotation语义和连续矩形footprint全部通过时替换。
  state_lattice_smoothing_enabled: true
  state_lattice_smoother_max_iterations: 1000
  state_lattice_smoother_w_data: 0.2
  state_lattice_smoother_w_smooth: 0.3
  state_lattice_smoother_tolerance: 1.0e-10
  state_lattice_smoother_do_refinement: true
  state_lattice_smoother_refinement_num: 2
  state_lattice_smoother_max_time: 1.0
  # 下面是本项目额外的原子接受门槛，不改变官方迭代公式。
  state_lattice_smoother_max_path_length_ratio: 1.05
  state_lattice_smoother_max_center_cost_increase: 0.0
  state_lattice_smoother_max_mean_center_cost_increase: 0.5
  state_lattice_smoother_max_curvature_regression_ratio: 1.05
  state_lattice_smoother_minimum_curvature_improvement: 0.001
  # Theta 中心线仅允许进入更低的膨胀代价区域。按当前现场调试策略，
  # Theta 所属路径段不做全局规划器的连续矩形 footprint 扫掠，由 MPPI
  # 在执行时结合局部代价图避障；State 前/后缀的连续 footprint 校验保留。
  theta_max_allowed_cost: 10
  theta_full_footprint_validation_enabled: false
  theta_w_traversal_cost: 32.0
  theta_w_euc_cost: 1.5
  theta_w_heuristic_cost: 1.0
  theta_reference_spacing: 0.05
  theta_reference_smoothing_enabled: true
  # 整条Theta参考若不超过100点，State从实时起点一次接管完整短连接，
  # 使用剩余总预算且失败后不重复FULL。较长路线的100点末段无解时，
  # 才自动扩大到160/240/400点；各档共享同一总期限。
  # 首选100点后缀允许连续搜索最多60秒，避免在系统负载较高时
  # 反复丢弃已展开状态；后续候选仍共享同一180秒绝对期限。
  theta_suffix_candidate_max_planning_time: 60.0
  # 从实车精确SE(2)出发，先尝试在Theta前方第40个参考点（约2m）
  # 以当地切线接入；失败才扩大到80/120/160点。主路径只接受连续
  # 前进、无原地旋转的State前缀。每档预算与后缀共享180秒总期限。
  theta_prefix_candidate_max_planning_time: 20.0
  # 接点必须同位置/同航向，且前后几何切线和局部曲率连续。0.20rad
  # 覆盖32航向格的单格量化误差，2.5rad/m对应0.4m原语曲率尺度。
  theta_prefix_join_max_heading_error: 0.20
  theta_prefix_join_max_curvature_jump: 2.5
  # 前缀和整路State搜索均只允许连续前进原语。找不到安全前进接入时
  # 继续扩大接入距离，最后使用同样禁止原地旋转的FULL State搜索；
  # 不再把Theta起点改造成含方向歧义的原地旋转回退。
  # 若保留的Theta前缀在某条边首次发生矩形车身连续碰撞，State不再
  # 从整条路线起点重搜；接管点沿Theta向起点方向提前30个参考姿态，
  # 并由State从该处一直规划到最终目标。
  theta_unsafe_segment_lookback_points: 30
  # 旧的“State 在整条 Theta 走廊中搜索全程”保留代码用于离线对照，
  # 生产关闭，避免复合后缀失败时先重复消耗四档走廊预算。
  theta_corridor_search_enabled: false
  coarse_route_max_planning_time: 5.0
  corridor_level_max_planning_time: 10.0
  # 早期走廊即使全部失败，也给无限制域 FULL 搜索和最新地图复核
  # 保留独立预算，避免“有回退代码、实际却没有回退时间”。
  corridor_full_search_min_time: 12.0
  final_validation_reserve_time: 5.0
  # 在受限走廊内，用 Theta 粗路线的剩余弧长修正官方直线启发式被
  # U 形障碍误导的问题；它只改变候选排序，FULL 回退会完全关闭。
  corridor_route_progress_weight: 1.0

  # 搜索代价沿用 Nav2 官方 State Lattice 参数语义。
  # 生产运动约束明确禁止倒车：保留前进圆弧和原地旋转，不展开
  # reverse primitives。这也避免 Reeds-Shepp 启发式未表达 reverse_penalty
  # 时用大量倒车分支干扰固定终点姿态的前进进场搜索。
  reverse_penalty: 4.0
  # 现场复测发现 State 后缀会连续选择“右弯-直线-左弯-直线”，
  # 虽然 MPPI 能准确跟踪，但会形成可见的左右摆动。该参数只提高
  # 左右转向原语互相切换的代价，不增加持续同向圆弧的代价。
  change_penalty: 0.45
  # 降低移动圆弧相对直线的附加代价，让终点角差较大时更愿意
  # 提前走连续圆弧，而不是把主要转向留到最后的小范围内。
  non_straight_penalty: 1.05
  # 增强全局搜索对软膨胀代价的敏感度，使路径在空间允许时
  # 主动远离墙体和禁行区；完整 footprint 仍负责硬碰撞边界。
  cost_penalty: 5.0
  retrospective_penalty: 0.015
  # 差速底盘可原地转向。该代价仍高于普通移动步，但不再高到迫使
  # 搜索用一段倒车代替合理的姿态调整。
  # 优先用连续前进圆弧完成姿态切入；只在通道几何确实
  # 需要时使用原地旋转原语。倒车扩展仍完全关闭。
  rotation_penalty: 10.0
  allow_reverse_expansion: false
  # 终点解析连接与启发式统一使用 Dubins 前进模型；若捷径碰撞，
  # 则继续搜索前进圆弧/原地旋转原语，不会退化成 Reeds-Shepp 倒车。
  prefer_forward_analytic_expansion: true
  cache_obstacle_heuristic: false
  downsample_obstacle_heuristic: true
  use_quadratic_cost_penalty: false
  analytic_expansion_ratio: 3.5
  # 允许从更远处尝试连续前进 Dubins 终点连接，提前完成姿态调整。
  analytic_expansion_max_length: 4.0
  analytic_expansion_max_cost: 200.0
  analytic_expansion_max_cost_override: false

  # 不使用中心点近似：每个采样姿态检查完整矩形 footprint；官方运动
  # 原语/解析扩展的相邻状态按各矩形顶点实际位移自适应细分到 1 cm。
  collision_checker_angle_bins: 72
  collision_check_resolution: 0.01
  # Never search a reset/not-yet-updated master. One live-map invalidation may
  # be replanned inside the same configured overall deadline.
  costmap_current_timeout: 3.0
  live_validation_retries: 1
  live_validation_retry_min_time: 0.25


# =========================
# 全局规划器参数（theta_star_planner_mbf / Theta*）
# 注意：这里必须用“实例名 ThetaStarPlanner”
# =========================
ThetaStarPlanner:
  allow_unknown: true
  terminal_checking_interval: 1024
  # Prefer paths through low-cost cells and reject cells too close to inflated
  # keepouts/obstacles. With the shared 10.0/1.0 inflation, cost 26 places the
  # continuous centre-line threshold at about 0.442 m; on the 5 cm grid the
  # nearest straight band is about 0.45 m. For the 0.65 m body this gives about
  # 0.12 m side clearance, while traversal cost still adds clearance when space allows.
  w_traversal_cost: 8.0
  w_euc_cost: 2.0
  w_heuristic_cost: 1.0
  max_allowed_cost: 26
  # Theta* 先保证 XY 拓扑连通；然后对不安全局部路段做 SE(2)
  # 修复，每条候选边都连续扫掠完整矩形车身。不再因某个初始
  # footprint 冲突就立即否定整条已连通路径。
  use_footprint_path_check: true
  goal_tolerance: 0.05
  # 缓存复用同时比较终点朝向，避免相同 XY 但新的清扫进入方向
  # 错误复用上一条路径。
  goal_orientation_tolerance: 0.05
  path_check_interval: 0.05
  path_max_age: 60.0
  # 先保证目标 XY 可达，再在已成功路径的末段做朝向连续几何整形。
  # 整形失败不会否定已经连通的 block，Connect MPPI 仍可使用原始 XY 路径。
  terminal_approach_enabled: true
  # 优先保留 0.40 m 同目标朝向直线尾段；空间受限时按 0.10 m
  # 逐步缩短到 0 m，但 Bezier 终点切线仍与目标朝向一致。
  terminal_straight_length: 0.40
  terminal_min_straight_length: 0.00
  terminal_straight_length_step: 0.10
  # 差速底盘可原地转向，0 表示不施加 Dubins/汽车型最小转弯半径硬约束。
  terminal_min_turn_radius: 0.00
  terminal_sample_step: 0.05
  # 允许在目标前约 1.8 m 内选择末段替换点，给提前对向留出空间。
  terminal_max_prefix_splice_distance: 1.80
  # 旧 Theta* 插件保留原有局部修复能力；本次“State 后缀不倒车”
  # 只约束 SmacLatticePlanner，不扩展成其他规划器的全局策略。
  se2_refinement_enabled: true
  se2_allow_reverse: true
  # 与 Theta* 的 allow_unknown 保持一致，允许完整车身扫掠经过未知栅格；
  # 致命障碍和地图边界仍按硬碰撞拒绝。
  se2_allow_unknown: true
  se2_yaw_bins: 32
  se2_max_expansions: 300000
  se2_max_repairs: 8
  se2_motion_step: 0.10
  se2_collision_check_step: 0.025
  se2_goal_position_tolerance: 0.12
  se2_goal_yaw_tolerance: 0.20
  se2_repair_window_lengths: [1.8, 3.0, 4.5, 6.0]
  se2_corridor_widths: [0.75, 1.25, 2.0]


# =========================
# 点对点导航局部控制器（my_planner）
# =========================
MyPlanner:
  max_vel_x: 0.25
  acc_lim_x: 0.30
  max_vel_theta: 0.30
  acc_lim_theta: 1.0
  lookahead_dist: 0.50
  goal_tolerance: 0.05


# =========================
# MPPI 局部控制器（实例 1：全覆盖清扫）
# =========================
# 参数语义以 Nav2 MPPI 官方文档为基线；标有“本项目扩展”的参数由
# ROS1/MBF 适配层实现。Standard 与 State 保持独立完整配置，不继承。
# 官方参数说明：https://docs.nav2.org/configuration/packages/configuring-mppic.html
# 官方调参指南：https://github.com/ros-navigation/navigation2/tree/main/nav2_mppi_controller
MPPI_Standard_Controller:
  # --- ROS1/MBF 适配层：里程计与到达判定（本项目扩展） ---
  odom_topic: /odom
  # 只作用于整条路径的最终目标，不是每个路径点的跟踪容差。
  goal_tolerance: 0.60
  angle_tolerance: 0.40
  # 同时满足位置/航向容差及以下速度门槛，并连续保持指定时间，才报告到达。
  trans_stopped_velocity: 0.02
  rot_stopped_velocity: 0.03
  goal_stopped_time: 0.30
  speed_limit_topic: "/coverage_executor/speed_limit_scale"

  # --- 官方 MPPI：预测模型与采样 ---
  motion_model: "DiffDrive"
  # 本移植参数；官方由Controller Server提供。用于控制序列平移，须与实际频率一致。
  controller_frequency: 10.0
  time_steps: 50              # 每条候选轨迹的预测点数
  model_dt: 0.10              # 相邻预测点时间间隔；预测时域 = 50 x 0.10 = 5.0 s
  batch_size: 1800            # 每次迭代随机采样的候选轨迹数
  iteration_count: 1          # 官方建议通常保持1，算力优先用于增加batch_size

  # 高斯控制噪声标准差；决定候选控制在各速度轴上的搜索宽度。
  vx_std: 0.15
  vy_std: 0.0                 # DiffDrive 不采样横向速度
  wz_std: 0.30

  # 速度与加速度约束。
  vx_min: 0.0                 # 禁止采样倒车
  vx_max: 0.36
  vy_max: 0.0                 # DiffDrive 横向速度必须为0
  wz_max: 0.60
  ax_max: 3.0
  ax_min: -0.6                # 负值表示最大纵向减速度
  az_max: 1.0

  # softmax温度越低，越集中选择低代价候选；gamma不是时间折扣，
  # 而是控制平滑性（较高）与低控制能量（较低）之间的权衡。
  temperature: 0.30
  gamma: 0.015

  # false：使用里程计速度作为初始状态；true：使用上一条已发命令。
  open_loop: false
  # false复用预生成噪声，减少运行时线程抖动；true每轮重新生成。
  regenerate_noises: false
  # 是否先对原始采样控制施加加速度限制；不对称ax上下限下需谨慎开启。
  clamp_raw_controls: false
  # 执行器延迟补偿，单位秒；当前无已测得的延迟补偿。
  model_delay_vx: 0.0
  model_delay_vy: 0.0
  model_delay_wz: 0.0
  # 最优控制序列的Savitzky-Golay滤波阶数；官方推荐2阶。
  sgf_order: 2
  # 无可行轨迹时允许软复位重试的次数，超过后向MBF报告失败。
  retry_attempt_limit: 2

  # --- 官方 PathHandler：路径裁剪与坐标变换 ---
  # 从当前最近点向前保留的局部路径弧长。
  prune_distance: 2.50
  # 沿剩余全局路径查找“离机器人最近点”的最大搜索弧长。
  max_robot_pose_search_dist: 2.50
  # 路径坐标变换允许的最大TF等待/时间容差。
  transform_tolerance: 0.25
  # PathAlign/PathFollow按官方语义共享“路径中心点”有效性缓存；候选轨迹的
  # 完整矩形车身碰撞仍由CostCritic逐预测点检查，避免职责重复和窗口边界误判。

  # --- 诊断与最终轨迹复核 ---
  timing_diagnostics: false  # 本项目扩展：周期输出优化器/Critic耗时
  publish_critic_stats: true # 本项目扩展：有订阅者时发布轻量Critic统计
  critic_stats_publish_period: 10
  # 关闭候选轨迹Marker构造/发布，减少计算与通信负载；Critic统计不受影响。
  visualize: false
  TrajectoryVisualizer:
    trajectory_step: 5       # 每隔多少条候选轨迹可视化一条
    time_step: 3             # 每隔多少个预测点可视化一个点
  # 本项目扩展。false时直接使用经Critic评分的标准softmax控制结果；
  # 候选轨迹的逐点完整车体碰撞检查仍由CostCritic负责。
  TrajectoryValidator:
    enabled: false
    # 以下为官方插件选择及本项目连续插值精度；仅enabled=true时生效。
    plugin: "mppi::DefaultOptimalTrajectoryValidator"
    maximum_corner_motion: 0.025

  # --- 官方 Critic 插件列表：顺序也是评分/诊断顺序 ---
  critics: ["ConstraintCritic", "CostCritic", "GoalAngleCritic", "GoalCritic",
            "PathAlignCritic", "PathAngleCritic", "PathFollowCritic",
            "PreferForwardCritic", "TwirlingCritic"]

  ConstraintCritic:
    enabled: true
    cost_power: 1
    cost_weight: 5.0         # 惩罚超出运动学速度约束的候选，不负责碰撞检测

  CostCritic:
    enabled: true
    allow_unknown: true      # 本项目扩展：允许候选轨迹经过 unknown，地图外仍由边界检查处理
    cost_power: 1
    cost_weight: 12.0        # 代价地图软斥力权重；内部按254归一化
    critical_cost: 300.0     # 中心代价达到near_collision_cost后的固定严重惩罚
    consider_footprint: true # 使用完整矩形车体检查硬碰撞
    collision_cost: 1000000.0
    # 进入该剩余路径距离后停止累加普通软膨胀代价，硬碰撞检查仍保留。
    near_goal_distance: 0.35
    trajectory_point_step: 1 # 每个预测点都评分/检查
    parallel_threads: 10     # 本项目扩展：候选轨迹并行评分线程数

  GoalAngleCritic:
    enabled: true
    cost_power: 1
    cost_weight: 3.2
    # 剩余局部路径长度不大于该值时，开始引导轨迹收敛到终点航向。
    threshold_to_consider: 0.60

  GoalCritic:
    enabled: true
    cost_power: 1
    cost_weight: 5.2
    # 剩余局部路径长度不大于该值时，开始引导轨迹收敛到终点位置。
    threshold_to_consider: 1.00

  PathAlignCritic:
    enabled: true
    cost_power: 1
    cost_weight: 6.0
    # 路径中心不可安全到达的点比例超过该值时停用对齐；
    # PathFollow共享同一中心点有效性缓存并跳到后续首个有效点。
    max_path_occupancy_ratio: 0.07
    # 当前覆盖路径约5 cm采样；6点约为0.30 m，使慢速紧弯时
    # PathAlign仍能介入，又不在刚起步时过早锁死方向。
    offset_from_furthest: 6
    trajectory_point_step: 4
    # 剩余局部路径短于该值时停用，让Goal类Critic接管。
    threshold_to_consider: 0.40
    # 可行路径含有效航向时，将路径航向也纳入对齐代价。
    use_path_orientations: true

  PathAngleCritic:
    enabled: true
    cost_power: 1
    cost_weight: 2.2
    # 取“候选已到最远路径点”之后若干点，计算前进方向角误差。
    offset_from_furthest: 4
    threshold_to_consider: 0.40
    # 当前姿态相对上述参考点的角误差超过该值时，本Critic才介入。
    max_angle_to_furthest: 0.80
    # 0=偏好前进；1=前后方向均可；2=遵循可行路径点给出的航向。
    mode: 2

  PathFollowCritic:
    enabled: true
    cost_power: 1
    cost_weight: 7.0        # 推动候选轨迹沿路径向前取得进展
    # 以候选已到最远路径点为基准，再向前选取若干路径点作为追踪目标。
    offset_from_furthest: 6
    threshold_to_consider: 0.40

  PreferForwardCritic:
    enabled: true
    cost_power: 1
    cost_weight: 4.0        # 惩罚倒车速度，不是转弯惩罚
    threshold_to_consider: 0.40

  TwirlingCritic:
    enabled: true
    cost_power: 1
    cost_weight: 2.0        # 惩罚平均角速度，减少不必要旋转；目标容差内停用

# =========================
# MPPI 局部控制器（停用存档：State Lattice 点对点）
# =========================
# 当前未在controllers中注册，下面参数不会创建控制器实例；保留用于后续对照恢复。
MPPI_State_Lattice_Controller:
  # --- ROS1/MBF 适配层：里程计与到达判定（本项目扩展） ---
  odom_topic: /odom
  # 只作用于整条State路径的最终目标。外层MBF/Executor仍独立复核任务目标。
  goal_tolerance: 0.50
  angle_tolerance: 0.40
  trans_stopped_velocity: 0.02
  rot_stopped_velocity: 0.03
  goal_stopped_time: 0.30
  speed_limit_topic: "/coverage_executor/speed_limit_scale"

  # --- 官方 MPPI：预测模型与采样 ---
  motion_model: "DiffDrive"
  controller_frequency: 10.0
  time_steps: 60              # 预测时域 = 60 x 0.10 = 6.0 s
  model_dt: 0.10
  batch_size: 1800
  iteration_count: 1

  vx_std: 0.15
  vy_std: 0.0
  wz_std: 0.35

  vx_min: 0.0
  vx_max: 0.38
  vy_max: 0.0
  wz_max: 0.80
  ax_max: 3.0
  ax_min: -0.6
  az_max: 1.0

  temperature: 0.30
  gamma: 0.015
  open_loop: false
  regenerate_noises: false
  clamp_raw_controls: false
  model_delay_vx: 0.0
  model_delay_vy: 0.0
  model_delay_wz: 0.0
  sgf_order: 2
  retry_attempt_limit: 2

  # --- 官方 PathHandler ---
  prune_distance: 2.50
  max_robot_pose_search_dist: 3.00
  transform_tolerance: 0.25

  # --- 诊断与最终轨迹复核 ---
  timing_diagnostics: false
  publish_critic_stats: true
  critic_stats_publish_period: 10
  visualize: false
  # visualize=false时使用默认降采样值；需要调试时打开即可。
  TrajectoryVisualizer:
    trajectory_step: 5
    time_step: 3
  TrajectoryValidator:
    enabled: false
    plugin: "mppi::DefaultOptimalTrajectoryValidator"
    maximum_corner_motion: 0.025

  # State路径已由全局规划器按前进语义生成，因此不再叠加
  # PreferForwardCritic；也不使用TwirlingCritic压制必要的路径转向。
  critics: ["ConstraintCritic", "CostCritic", "GoalAngleCritic", "GoalCritic",
            "PathAlignCritic", "PathAngleCritic", "PathFollowCritic"]

  ConstraintCritic:
    enabled: true
    cost_power: 1
    cost_weight: 5.0

  CostCritic:
    enabled: true
    allow_unknown: false
    cost_power: 1
    cost_weight: 10.0
    critical_cost: 300.0
    consider_footprint: true
    collision_cost: 1000000.0
    near_goal_distance: 0.10
    trajectory_point_step: 1
    parallel_threads: 10

  GoalAngleCritic:
    enabled: true
    cost_power: 1
    cost_weight: 8.0
    threshold_to_consider: 0.80

  GoalCritic:
    enabled: true
    cost_power: 1
    cost_weight: 4.0
    threshold_to_consider: 0.60

  PathAlignCritic:
    enabled: true
    cost_power: 1
    cost_weight: 10.0
    max_path_occupancy_ratio: 0.03
    offset_from_furthest: 6
    trajectory_point_step: 4
    threshold_to_consider: 0.025
    # 仅做位置对齐；动态避障时允许临时偏航。
    use_path_orientations: false
    # 与PathFollow共享同一份完整车体路径有效性缓存。

  PathAngleCritic:
    enabled: true
    cost_power: 1
    cost_weight: 2.5
    offset_from_furthest: 8
    threshold_to_consider: 0.025
    max_angle_to_furthest: 0.65
    mode: 2

  PathFollowCritic:
    enabled: true
    cost_power: 1
    cost_weight: 5.0
    offset_from_furthest: 8
    threshold_to_consider: 0.025
