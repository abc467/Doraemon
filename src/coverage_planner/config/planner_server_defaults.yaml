# planner_server.launch 加载到
# coverage_planner_server 和 site_editor_service 的默认参数。

# 规划路径和调试可视化默认使用的输出坐标系。
frame_id: "map"
# 规划调试可视化话题使用的命名空间。
topic_ns: "/f2c"

# 是否自动从 /map 读取当前运行时地图标识（map_id / map_md5）。
auto_map_identity_enable: true
# 用于识别当前运行时地图的 OccupancyGrid 话题。
map_topic: "/map"
# 等待运行时地图标识的超时时间，单位秒。
map_identity_timeout_s: 2.0
# 存入规划数据库的规划器版本字符串。
planner_version: "coverage_planner_v1"
# 当虚拟墙没有单独配置 buffer 时使用的默认缓冲距离，单位米。
default_virtual_wall_buffer_m: 0.25
# 以下三项只用于生成 Coverage 有效规划边界，不能作为导航代价地图的 254 硬边界。
# 旧版等距膨胀参数；非矩形或显式等距配置的兼容兜底，单位米。
default_no_go_buffer_m: 0.05
# 矩形禁行区长边的法向外扩距离，不是沿长边方向延长，单位米。
# 配合 wall_margin=0.38 m、0.65 m 物理车宽，直线段理论车体净距为：
# 0.115 + 0.38 - 0.65 / 2 = 0.17 m。
default_no_go_long_edge_normal_buffer_m: 0.115
# 矩形禁行区短边的法向外扩距离，不是沿短边方向延长，单位米。
# 与长边法向保持一致；叠加 wall_margin 后，0.65 m 宽车体的直线净距为 0.17 m。
default_no_go_short_edge_normal_buffer_m: 0.115
robot:
  # Fields2Cover 使用的覆盖条带宽度；由 0.54 m 增加 0.05 m，当前相邻内部
  # 清扫直线中心间距为 0.59 m；它不是路径点间距。
  cov_width: 0.59
  # 机器人物理宽度，单位米。
  width: 0.65
  # 机器人最小转弯半径，单位米；内部180度转弯的理论最短弧长约为
  # pi * 0.34 = 1.068 m。
  min_turning_radius: 0.34
  # 曲率变化约束上限；值越小，转弯通常越平滑。
  max_diff_curv: 0.30

planner:
  # Boustrophedon 分解时使用的分割角，单位度。
  split_angle_deg: 0.0
  # 相邻条带之间的转弯模型，可选 dubins、dubinscc、reeds_shepp（前提是绑定支持）。
  turn_model: "dubins"
  # 仅用于调试 / RViz 显示的重采样步长，单位米。
  viz_step_m: 0.05
  # 最终输出路径的点间距，单位米。
  path_step_m: 0.05
  # 转弯段离散化采样步长，单位米。
  turn_step_m: 0.05
  # 调试可视化 marker 的线宽。
  line_w: 0.05
  # 是否抑制 Fields2Cover 原生调用输出的 stderr 噪声。
  mute_stderr: true
  # 生成后的路径中心点必须全部留在有效清扫区域内。核心规划器在收到
  # effective_regions 时也会强制执行该复核，不能通过参数关闭。
  validate_effective_region_path: true
  # 生成覆盖路径前，路径中心相对墙体 / 边界的收缩安全距离，单位米。
  # 狭窄区域如果无法满足该安全边距，应规划失败，而不是自动降低安全距离。
  wall_margin_m: 0.38
  # 从源 Cell / 内接矩形边界到条带裁剪端点的总退让目标，单位米。
  # 内接矩形已在四边预先应用 wall_margin，实际条带裁剪量会自动减去该部分：1.20-0.38=0.82m。
  turn_margin_m: 1.20
  # 约束切分后的子区域短边小于该值时，不送入 Fields2Cover，单位米。
  # 0 表示使用动态估算；这里使用小正数，只过滤明显退化区域，让实际规划结果决定是否可用。
  min_plannable_span_m: 0.05
  # Fields2Cover 生成的条带低于此长度时不参与 Snake 排序和 Dubins 连接，用于剔除孔洞端部的数值尖刺。
  min_swath_length_m: 0.40
  # 边缘收边环路使用的圆角半径；实际生效值不会小于 min_turning_radius。
  # 0.45m 使圆角相对原 0.40m 提前约 5cm 开始切弯，降低临近边界时的急转需求。
  edge_corner_radius_m: 0.45
  # 圆角 Bezier 控制点向区域内部的拉入比例；增大只内缩圆角，不平移外环直线段。
  # 0.20 让圆角进一步温和内缩，同时避免明显损失外围覆盖面积。
  edge_corner_pull: 0.20
  # 每个圆角最少采样点数。
  edge_corner_min_pts: 36
  # 在蛇形主路径上选择 P_pre 时，前向投影窗口的起点，单位米。
  # 增大该窗口可让 conn1 以更平缓的角度接入外围环路。
  pre_proj_min: 0.90
  # 在蛇形主路径上选择 P_pre 时，前向投影窗口的终点，单位米。
  pre_proj_max: 1.00
  # 在蛇形主路径前缀上搜索 P_pre 时允许搜索的最大弧长，单位米。
  # 必须覆盖 pre_proj_max；保留约 0.40m 余量以应对弯曲前缀。
  pre_prefix_max: 1.40
  # 从 E_start 沿外围环路选择 e_pre 时，弧长窗口的起点，单位米。
  e_pre_min: 0.90
  # 从 E_start 沿外围环路选择 e_pre 时，弧长窗口的终点，单位米。
  e_pre_max: 1.00
